plugins { id 'com.android.library'; id 'maven-publish' }

def ftcVer = project.findProperty('ftcSdkVersion') ?: '11.1.0'
def ivyVer = project.findProperty('ivyVersion') ?: '1.1.1'

android {
    namespace 'com.flowpath.ivy'
    compileSdk 34
    defaultConfig { minSdk 24 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    publishing { singleVariant('release') { withSourcesJar() } }
}

dependencies {
    implementation project(':flowpath')
    compileOnly "com.pedropathing.ivy:pedro:${ivyVer}"   // Ivy; your robot project supplies it at runtime
}

afterEvaluate {
    publishing { publications { release(MavenPublication) {
        from components.release
        groupId = 'com.flowpath'; artifactId = 'flowpath-ivy'; version = project.version
    } } }
}
