<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowPath Dashboard</title>
<style>
  :root { --bg:#0f1218; --panel:#181d27; --line:#2a3242; --text:#e6e9ef; --dim:#8b93a5;
          --accent:#4da3ff; --ok:#3ddc84; --warn:#ffb74d; --bad:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  main { display:grid; grid-template-columns:minmax(300px,1fr) 380px; gap:12px; padding:12px; height:calc(100vh - 47px); }
  @media (max-width:900px){ main{ grid-template-columns:1fr; height:auto; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  #fieldWrap { display:flex; flex-direction:column; gap:8px; min-height:0; }
  #stage { flex:1; min-height:300px; display:flex; align-items:center; justify-content:center; }
  canvas { background:#0b0e14; border-radius:6px; max-width:100%; max-height:100%; aspect-ratio:1/1; }
  .bar { display:flex; gap:14px; flex-wrap:wrap; align-items:center; color:var(--dim); font-size:12px; }
  .bar label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  button { background:#232b3a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  aside { display:flex; flex-direction:column; gap:12px; overflow:auto; min-height:0; }
  table { width:100%; border-collapse:collapse; }
  td { padding:2px 4px; font-variant-numeric:tabular-nums; }
  td:first-child { color:var(--dim); width:42%; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 6px; }
  .big { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .pill { padding:1px 8px; border-radius:10px; background:#232b3a; font-size:12px; }
  .pw { display:flex; gap:6px; align-items:flex-end; height:50px; }
  .pw div { flex:1; background:#232b3a; position:relative; border-radius:3px; height:100%; }
  .pw i { position:absolute; left:0; right:0; background:var(--accent); }
  details { border-top:1px solid var(--line); padding:4px 0; }
  summary { cursor:pointer; color:var(--accent); font-weight:600; padding:4px 0; }
  .p { display:grid; grid-template-columns:1fr 78px; gap:2px 8px; align-items:center; padding:3px 0; }
  .p .n { grid-column:1/3; color:var(--dim); font-size:12px; display:flex; justify-content:space-between; }
  .p input[type=range] { width:100%; }
  .p input[type=number] { width:100%; background:#0b0e14; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 4px; }
  .mod { color:var(--warn); }
  #plot { width:100%; height:80px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="conn"></span><h1>FlowPath</h1>
  <span class="pill" id="mode">-</span><span class="pill" id="busy">idle</span>
  <span style="margin-left:auto;color:var(--dim)" id="hz"></span>
</header>

<main>
  <section id="fieldWrap" class="card">
    <div id="stage"><canvas id="cv"></canvas></div>
    <div class="bar">
      <label><input type="checkbox" id="oTrail" checked> jejak</label>
      <label><input type="checkbox" id="oPath" checked> path</label>
      <label><input type="checkbox" id="oVel" checked> vektor kecepatan</label>
      <label><input type="checkbox" id="oFollow"> ikuti robot</label>
      <label>ukuran robot (in) <input type="number" id="rsize" value="18" min="6" max="24" style="width:52px"></label>
      <button id="clr">Hapus jejak</button>
      <span id="mouse" style="margin-left:auto"></span>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>Posisi</h2>
      <div class="big"><span id="px">0</span>, <span id="py">0</span> <span style="font-size:13px;color:var(--dim)">in</span></div>
      <div class="big"><span id="ph">0</span>° <span style="font-size:13px;color:var(--dim)">heading</span></div>
      <table>
        <tr><td>kecepatan</td><td id="vs">0</td></tr>
        <tr><td>omega</td><td id="vw">0</td></tr>
        <tr><td>segmen</td><td id="seg">-</td></tr>
        <tr><td>progress (t)</td><td id="tv">0</td></tr>
        <tr><td>target heading</td><td id="th">0</td></tr>
        <tr><td>error cross-track</td><td id="ec">0</td></tr>
        <tr><td>error heading</td><td id="eh">0</td></tr>
        <tr><td>sisa jarak</td><td id="er">0</td></tr>
      </table>
    </div>
    <div class="card">
      <h2>Power motor</h2><div class="pw" id="pw"></div>
    </div>
    <div class="card">
      <h2>Error cross-track (10 s)</h2><canvas id="plot"></canvas>
    </div>
    <div class="card"><h2>Telemetry</h2><table id="tel"></table></div>
    <div class="card">
      <h2>Tuning (static variable)</h2>
      <div class="bar" style="margin-bottom:6px">
        <button id="save">Save</button><button id="clear">Clear saved</button><span id="msg"></span>
      </div>
      <div id="params">memuat...</div>
    </div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const FIELD = 144;                       // inci
const cv = $('cv'), g = cv.getContext('2d');
let S = null;                            // packet terakhir
let trail = [], pathCache = [], lastT = 0, rate = 0, lastRecv = 0;
const errHist = [];                      // {t, v}

// ---------- ukuran canvas ----------
function fit() {
  const st = $('stage'), side = Math.max(280, Math.min(st.clientWidth, st.clientHeight || st.clientWidth));
  const d = window.devicePixelRatio || 1;
  cv.style.width = cv.style.height = side + 'px';
  cv.width = cv.height = Math.round(side * d);
}
addEventListener('resize', fit); fit();

// ---------- transform lapangan (origin kiri-bawah, +y ke atas) ----------
let view = { cx: 0, cy: 0, span: FIELD };
function sc() { return cv.width / view.span; }
const X = x => (x - (view.cx - view.span / 2)) * sc();
const Y = y => cv.height - (y - (view.cy - view.span / 2)) * sc();
function toField(px, py) {
  const r = cv.getBoundingClientRect(), k = cv.width / r.width;
  const s = sc();
  return [ (px - r.left) * k / s + (view.cx - view.span / 2),
           (cv.height - (py - r.top) * k) / s + (view.cy - view.span / 2) ];
}

// ---------- gambar ----------
function drawField() {
  const H = FIELD / 2, d = window.devicePixelRatio || 1;
  g.clearRect(0, 0, cv.width, cv.height);
  g.lineWidth = 1;
  for (let i = -H; i <= H; i += 24) {                   // tile 24 in, dari -72 sampai 72
    g.strokeStyle = i === 0 ? '#34405a' : '#1c2333';
    g.beginPath(); g.moveTo(X(i), Y(-H)); g.lineTo(X(i), Y(H)); g.stroke();
    g.beginPath(); g.moveTo(X(-H), Y(i)); g.lineTo(X(H), Y(i)); g.stroke();
  }
  g.strokeStyle = '#4a5878'; g.lineWidth = 2;
  g.strokeRect(X(-H), Y(H), FIELD * sc(), FIELD * sc());
  g.fillStyle = '#5b6882'; g.font = (11 * d) + 'px system-ui';
  for (let i = -H; i <= H; i += 24) {
    if (i > -H) g.fillText(i, X(i) + 3, Y(-H) - 4);
    if (i < H) g.fillText(i, X(-H) + 3, Y(i) - 3);
  }
}

function drawPath() {
  if (!$('oPath').checked) return;
  pathCache.forEach((seg, si) => {
    g.strokeStyle = (S && si === S.idx) ? '#4da3ff' : '#2f4a73';
    g.lineWidth = (S && si === S.idx) ? 3 : 2;
    g.beginPath();
    seg.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])));
    g.stroke();
  });
  if (pathCache.length) {                               // titik ujung segmen
    g.fillStyle = '#4da3ff';
    pathCache.forEach(seg => { const e = seg[seg.length - 1]; g.beginPath(); g.arc(X(e[0]), Y(e[1]), 4, 0, 7); g.fill(); });
  }
}

function drawTrail() {
  if (!$('oTrail').checked || trail.length < 2) return;
  g.lineWidth = 2;
  for (let i = 1; i < trail.length; i++) {
    g.strokeStyle = 'rgba(61,220,132,' + (0.15 + 0.85 * i / trail.length) + ')';
    g.beginPath(); g.moveTo(X(trail[i - 1][0]), Y(trail[i - 1][1])); g.lineTo(X(trail[i][0]), Y(trail[i][1])); g.stroke();
  }
}

function drawRobot() {
  if (!S) return;
  const [x, y, h] = S.pose, size = (+$('rsize').value || 18) * sc();
  g.save();
  g.translate(X(x), Y(y)); g.rotate(-h);                // canvas y terbalik -> putar -h
  g.fillStyle = 'rgba(77,163,255,.25)'; g.strokeStyle = '#4da3ff'; g.lineWidth = 2;
  g.fillRect(-size / 2, -size / 2, size, size); g.strokeRect(-size / 2, -size / 2, size, size);
  g.strokeStyle = '#ffb74d'; g.lineWidth = 3;           // panah depan robot
  g.beginPath(); g.moveTo(0, 0); g.lineTo(size / 2 + 6, 0); g.stroke();
  g.fillStyle = '#ffb74d'; g.beginPath();
  g.moveTo(size / 2 + 12, 0); g.lineTo(size / 2 + 2, -5); g.lineTo(size / 2 + 2, 5); g.fill();
  g.restore();

  if (S.busy) {                                          // titik terdekat di path + target heading
    g.fillStyle = '#ff5c5c'; g.beginPath(); g.arc(X(S.closest[0]), Y(S.closest[1]), 5, 0, 7); g.fill();
    g.strokeStyle = '#ff5c5c'; g.setLineDash([5, 4]); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(X(x), Y(y)); g.lineTo(X(S.closest[0]), Y(S.closest[1])); g.stroke();
    g.setLineDash([]);
    g.strokeStyle = '#d17bff'; g.lineWidth = 2;
    const L = size * 0.9;
    g.beginPath(); g.moveTo(X(x), Y(y));
    g.lineTo(X(x) + Math.cos(S.th) * L, Y(y) - Math.sin(S.th) * L); g.stroke();
  }
  if ($('oVel').checked) {                               // vektor kecepatan (1 s ke depan)
    g.strokeStyle = '#3ddc84'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(X(x), Y(y)); g.lineTo(X(x + S.vel[0]), Y(y + S.vel[1])); g.stroke();
  }
}

function frame() {
  if (S && $('oFollow').checked) { view.span = 72; view.cx = S.pose[0]; view.cy = S.pose[1]; }
  else { view.span = FIELD; view.cx = view.cy = 0; }
  drawField(); drawPath(); drawTrail(); drawRobot();
  drawPlot();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

cv.addEventListener('mousemove', e => {
  const [fx, fy] = toField(e.clientX, e.clientY);
  $('mouse').textContent = 'kursor: ' + fx.toFixed(1) + ', ' + fy.toFixed(1);
});
cv.addEventListener('mouseleave', () => $('mouse').textContent = '');
$('clr').onclick = () => { trail = []; };

// ---------- plot error ----------
function drawPlot() {
  const c = $('plot'), d = window.devicePixelRatio || 1;
  const w = c.clientWidth * d, h = c.clientHeight * d;
  if (c.width !== w) { c.width = w; c.height = h; }
  const q = c.getContext('2d'); q.clearRect(0, 0, w, h);
  q.strokeStyle = '#2a3242'; q.beginPath(); q.moveTo(0, h / 2); q.lineTo(w, h / 2); q.stroke();
  if (errHist.length < 2) return;
  const now = errHist[errHist.length - 1].t;
  const maxv = Math.max(2, ...errHist.map(e => Math.abs(e.v)));
  q.strokeStyle = '#ffb74d'; q.lineWidth = 1.5 * d; q.beginPath();
  errHist.forEach((e, i) => {
    const px = w - (now - e.t) / 10 * w, py = h / 2 - e.v / maxv * (h / 2 - 3);
    i ? q.lineTo(px, py) : q.moveTo(px, py);
  });
  q.stroke();
}

// ---------- terima data ----------
const f1 = (v, n = 1) => (+v).toFixed(n);
function onPacket(p) {
  S = p;
  const now = performance.now();
  if (lastRecv) rate = rate * 0.9 + (1000 / (now - lastRecv)) * 0.1;
  lastRecv = now;
  $('hz').textContent = rate.toFixed(0) + ' Hz';

  const [x, y, h] = p.pose;
  const last = trail[trail.length - 1];
  if (!last || Math.hypot(last[0] - x, last[1] - y) > 0.25) trail.push([x, y]);
  if (trail.length > 1500) trail.shift();

  if (p.path) pathCache = p.path;

  $('mode').textContent = p.mode; $('busy').textContent = p.busy ? 'following' : 'idle';
  $('px').textContent = f1(x, 2); $('py').textContent = f1(y, 2); $('ph').textContent = f1(h * 180 / Math.PI);
  $('vs').textContent = f1(Math.hypot(p.vel[0], p.vel[1])) + ' in/s';
  $('vw').textContent = f1(p.vel[2], 2) + ' rad/s';
  $('seg').textContent = p.idx + ' / ' + pathCache.length;
  $('tv').textContent = f1(p.tval, 3);
  $('th').textContent = f1(p.th * 180 / Math.PI) + '°';
  $('ec').textContent = f1(p.err.cross, 2) + ' in';
  $('eh').textContent = f1(p.err.head * 180 / Math.PI) + '°';
  $('er').textContent = f1(p.err.rem, 1) + ' in';

  const pw = $('pw');
  if (pw.children.length !== p.pw.length) {
    pw.innerHTML = p.pw.map(() => '<div><i></i></div>').join('');
  }
  p.pw.forEach((v, i) => {
    const el = pw.children[i].firstChild, hgt = Math.abs(v) * 50;
    el.style.height = hgt + '%'; el.style.top = v >= 0 ? (50 - hgt / 2 * 1) + '%' : '50%';
    el.style.background = v >= 0 ? 'var(--accent)' : 'var(--warn)';
  });

  errHist.push({ t: p.t, v: p.err.cross });
  while (errHist.length && p.t - errHist[0].t > 10) errHist.shift();

  $('tel').innerHTML = Object.entries(p.tel || {}).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') ||
    '<tr><td colspan=2 style="color:var(--dim)">kosong (pakai Dash.put)</td></tr>';
}

// ---------- koneksi SSE (otomatis sambung ulang) ----------
function connect() {
  const es = new EventSource('/stream');
  es.onopen = () => $('conn').classList.add('on');
  es.onmessage = e => { try { onPacket(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { $('conn').classList.remove('on'); es.close(); setTimeout(connect, 1000); };
}
connect();

// ---------- tuning ----------
const open = new Set(['Translation', 'Heading']);
let sendTimer = {};
function send(name, value) {
  clearTimeout(sendTimer[name]);
  sendTimer[name] = setTimeout(() =>
    fetch('/api/set?name=' + encodeURIComponent(name) + '&value=' + encodeURIComponent(value)).catch(() => {}), 60);
}
function note(t) { $('msg').textContent = t; setTimeout(() => $('msg').textContent = '', 2500); }

async function loadParams() {
  let data;
  try { data = await (await fetch('/api/params')).json(); } catch (e) { $('params').textContent = 'gagal memuat'; return; }
  const groups = {};
  data.params.forEach(p => { const [gname, f] = p.k.split('.'); (groups[gname] = groups[gname] || []).push({ ...p, f }); });
  const root = $('params'); root.innerHTML = '';
  Object.entries(groups).forEach(([gname, list]) => {
    const d = document.createElement('details'); if (open.has(gname)) d.open = true;
    d.ontoggle = () => d.open ? open.add(gname) : open.delete(gname);
    d.innerHTML = '<summary>' + gname + '</summary>';
    list.forEach(p => {
      const row = document.createElement('div'); row.className = 'p';
      const changed = () => Math.abs(p.v - p.d) > 1e-9 || p.v !== p.d;
      if (p.t === 'bool') {
        row.innerHTML = `<div class="n"><span>${p.f}</span></div><label><input type="checkbox" ${p.v ? 'checked' : ''}> aktif</label>`;
        row.querySelector('input').onchange = e => send(p.k, e.target.checked);
      } else {
        const hi = Math.max(1, Math.abs(p.d) * 3, Math.abs(p.v) * 1.5);
        const step = p.t === 'int' ? 1 : hi / 500;
        row.innerHTML = `<div class="n"><span class="${changed() ? 'mod' : ''}">${p.f}</span><span>default ${p.d}</span></div>
          <input type="range" min="${p.d < 0 ? -hi : 0}" max="${hi}" step="${step}" value="${p.v}">
          <input type="number" step="any" value="${p.v}">`;
        const r = row.querySelector('[type=range]'), n = row.querySelector('[type=number]');
        r.oninput = () => { n.value = r.value; send(p.k, r.value); row.querySelector('span').className = 'mod'; };
        n.onchange = () => { r.value = n.value; send(p.k, n.value); row.querySelector('span').className = 'mod'; };
      }
      d.appendChild(row);
    });
    root.appendChild(d);
  });
}
$('save').onclick = async () => { const r = await (await fetch('/api/save')).json(); note(r.ok ? 'tersimpan' : 'gagal simpan'); };
$('clear').onclick = async () => { const r = await (await fetch('/api/clear')).json(); note(r.ok ? 'direset ke default' : 'gagal'); loadParams(); };
loadParams();
</script>
</body>
</html>
